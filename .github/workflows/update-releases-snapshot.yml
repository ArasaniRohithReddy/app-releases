name: update-releases-snapshot

# Keeps the Pages releases page working even when GitHub's API is unavailable or
# rate-limited (60 requests/hour per IP for anonymous callers — easily exhausted from a
# corporate NAT). Each product's releases page loads a same-origin snapshot first, then
# refreshes from the live API. This workflow regenerates that snapshot whenever a release
# changes. Scheduled runs are a fallback, not a freshness SLA: Actions/API failures
# must leave the saved history intact and surface a failed run for an operator.

on:
  release:
    # 'released' fires alongside 'published' for the same release, which ran this workflow twice
    # and had the two runs racing to push the same commit. 'published' alone covers a new release.
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  schedule:
    # Release events can be missed/delayed. Refresh on the default branch as well.
    - cron: '17 */6 * * *'

permissions:
  contents: write
  # GITHUB_TOKEN pushes do not trigger push workflows; dispatch checks explicitly.
  actions: write

concurrency:
  group: releases-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: >-
      github.repository == 'ArasaniRohithReddy/app-releases' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A release event checks out the tag, which leaves HEAD detached and makes the commit
      # below unpushable. Always work on the default branch, which is where the snapshot lives.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Slurp preserves page boundaries so the generator can reject malformed input.
          all=$(gh api -H "Accept: application/vnd.github.html+json" \
                  "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp)
          printf '%s' "$all" | node scripts/update-release-snapshot.js \
            docs/threat-model-reviewer/releases/releases.json

      - name: Commit the candidate locally if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/threat-model-reviewer/releases/releases.json; then
            echo "Snapshot already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/threat-model-reviewer/releases/releases.json
          git commit -m "chore: refresh releases snapshot for the Pages site"

      - name: Validate the candidate before publishing it
        run: npm test

      - name: Push only the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored -- docs)"
          # A concurrent main update must reject this push. Never rebase untested work
          # or force-push; rerun the workflow against the new base instead.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Dispatch same-SHA checks and the guarded Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Run even on a no-change refresh, so a previously failed dispatch can recover.
          # Dispatch captures current main as github.sha; checkout and artifact use that SHA.
          gh workflow run site-checks.yml --ref "${{ github.event.repository.default_branch }}"
