name: update-releases-snapshot

# Keeps the Pages releases page working even when GitHub's API is unavailable or
# rate-limited (60 requests/hour per IP for anonymous callers — easily exhausted from a
# corporate NAT). Each product's releases page loads a same-origin snapshot first, then
# refreshes from the live API. This workflow regenerates that snapshot whenever a release
# changes, so it can never go stale.

on:
  release:
    # 'released' fires alongside 'published' for the same release, which ran this workflow twice
    # and had the two runs racing to push the same commit. 'published' alone covers a new release.
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  schedule:
    # Release events proved unreliable for 'edited' activity, so this is the real guarantee:
    # the snapshot is never more than a few hours behind, and the page also refreshes from the
    # live API on every load, so the snapshot only ever backstops rate-limited visitors.
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: releases-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # A release event checks out the tag, which leaves HEAD detached and makes the commit
      # below unpushable. Always work on the default branch, which is where the snapshot lives.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Regenerate snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # product tag-prefix  ->  destination file
          declare -A PRODUCTS=(
            ["threat-model-reviewer-v"]="docs/threat-model-reviewer/releases/releases.json"
          )

          all=$(gh api -H "Accept: application/vnd.github.html+json" \
                  "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate)

          for prefix in "${!PRODUCTS[@]}"; do
            dest="${PRODUCTS[$prefix]}"
            mkdir -p "$(dirname "$dest")"
            echo "$all" | jq -c --arg p "$prefix" '
              [ .[]
                | select(.draft == false)
                | select(.tag_name | startswith($p))
                | {
                    tag_name, name, published_at, prerelease, body_html,
                    assets: [ .assets[] | { name, size, download_count, browser_download_url } ]
                  }
              ] | sort_by(.published_at) | reverse
            ' > "$dest"
            echo "$dest -> $(jq 'length' "$dest") releases, $(du -h "$dest" | cut -f1)"
          done

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Snapshot already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh releases snapshot for the Pages site [skip ci]"
          # Name the branch explicitly. A bare `git push` relies on an upstream that a checkout
          # driven by a release event does not have, which is how this silently stopped working.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
