name: Site and documentation checks

on:
  pull_request:
    paths: ['docs/**', 'products/**', 'scripts/**', 'package*.json', 'README.md', 'SECURITY.md', '.github/workflows/site-checks.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'products/**', 'scripts/**', 'package*.json', 'README.md', 'SECURITY.md', '.github/workflows/site-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
