name: Site and documentation checks

on:
  pull_request:
    paths: ['docs/**', 'products/**', 'scripts/**', 'package*.json', '*.md', 'LICENSE', '.github/workflows/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  # Do not interrupt a production deployment. Superseded SHAs are rejected below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Stage the checked commit only
        if: >-
          github.repository == 'ArasaniRohithReddy/app-releases' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          vars.PAGES_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored -- docs)"
          mkdir -p "$RUNNER_TEMP/checked-pages"
          git archive "${GITHUB_SHA}:docs" | tar -x -C "$RUNNER_TEMP/checked-pages"

      - name: Upload the checked Pages artifact
        if: >-
          github.repository == 'ArasaniRohithReddy/app-releases' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          vars.PAGES_DEPLOY_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/checked-pages
          retention-days: 1

  deploy:
    # Dormant until the coordinator changes Pages Source to GitHub Actions and opts in.
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.repository == 'ArasaniRohithReddy/app-releases' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse legacy publishing or a superseded commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [[ "$build_type" != "workflow" ]]; then
            echo "Pages is not workflow-backed. Coordinator activation is required; see scripts/PAGES-DEPLOYMENT.md."
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "This checked SHA is superseded. Dispatch site-checks.yml on current main instead."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.sha }}
