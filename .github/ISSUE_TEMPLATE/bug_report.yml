name: Bug report
description: Something isn't working in one of the apps.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **don't include secrets or sensitive source material** —
        no API keys or tokens, private files, unredacted screenshots/logs, personal/customer
        information or confidential business data. Use synthetic examples, such as a sample
        threat-model file or mockup, and inspect every attachment before sharing.
  - type: dropdown
    id: product
    attributes:
      label: App
      description: Which app is this about?
      options:
        - Threat Model Reviewer
        - shot2code
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app (title bar or Settings), or on the release you downloaded.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (MSI)
        - Installer (Setup.exe / NSIS .exe)
        - Portable (zip)
        - MSIX
        - Built from source
        - Other / not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "OS edition, build number and CPU architecture"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. See error
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error text / screenshots
      description: Share only sanitized error text or screenshots from synthetic inputs. Remove credentials and private personal, customer or business data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I inspected this report and its attachments; they contain no credentials, private files, sensitive screenshots/logs, customer data or confidential business information.
          required: true
